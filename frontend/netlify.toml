# Déploiement Netlify — frontend Valentynia (SPA React + Vite)
# Dans Netlify : "Base directory" = frontend
# Variable d'environnement à définir dans le dashboard Netlify :
#   VITE_API_URL = https://valentynia-api.onrender.com/api   (URL Render + /api)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Toutes les routes React renvoient vers index.html (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
