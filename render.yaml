# Blueprint Render — API Valentynia (backend Express + Prisma)
# Créer le service : Render Dashboard → New → Blueprint → sélectionner ce dépôt.
# Les variables marquées `sync: false` sont à renseigner dans le dashboard.
services:
  - type: web
    name: valentynia-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FACTURX_PROFILE
        value: EN16931
      - key: JWT_EXPIRES_IN
        value: 1d
      # Connexions Neon (pooled + directe). Onglet "Environment" du service.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Secret JWT : au moins 32 caractères. Render peut le générer.
      - key: JWT_SECRET
        generateValue: true
      # Clé AES-256 : 64 caractères hexadécimaux.
      # node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: AES_KEY
        sync: false
      # Domaine(s) autorisé(s) par CORS — l'URL Netlify du frontend.
      - key: CORS_ORIGIN
        sync: false
